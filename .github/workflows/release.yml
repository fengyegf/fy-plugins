name: release

# 一个仓库多个插件：按插件单独打 tag，一次只发布一个插件。
#
#   git tag whois-v0.1.2
#   git push origin whois-v0.1.2
#
# 推 tag 会构建该插件在 plugin.json 里声明的全部平台，打 bundle 并挂到 Release。
# 手动触发（Actions → release → Run workflow）只产出各平台 artifact，不建 Release，
# 用于先验证编译。

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      plugin:
        description: "插件 id（crates/fuyubot-plugin-<id>）"
        required: true
        type: choice
        options: [whois, musiccard, epic, kfc, ppxfy, system]
      version:
        description: "semver，不带 v（例如 0.1.2）"
        required: true

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.plan.outputs.id }}
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            id="${{ inputs.plugin }}"
            version="${{ inputs.version }}"
          else
            # tag 形如 whois-v0.1.2
            ref="${GITHUB_REF_NAME}"
            id="${ref%%-v*}"
            version="${ref#*-v}"
          fi
          python3 scripts/plan.py --plugin "$id" --version "$version" --github-output

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@v2
      - name: Setup Android NDK
        if: matrix.android_abi != ''
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Install cargo-ndk
        if: matrix.android_abi != ''
        run: cargo install cargo-ndk --locked
      - name: Build (native)
        if: matrix.target == ''
        run: cargo build --release --locked -p "fuyubot-plugin-${{ needs.meta.outputs.id }}"
      - name: Build (Android)
        if: matrix.android_abi != ''
        run: >-
          cargo ndk -t "${{ matrix.android_abi }}" --platform 24
          build --release --locked -p "fuyubot-plugin-${{ needs.meta.outputs.id }}"
      - name: Package bundle
        shell: bash
        # macOS / Linux 镜像只有 python3，Windows 镜像的可执行名是 python。
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          scripts/package.py
          --plugin "${{ needs.meta.outputs.id }}"
          --platform "${{ matrix.platform }}"
          --version "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [meta, build]
    # 手动触发只产出 Actions artifact，推 tag 才建 Release。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.meta.outputs.id }} v${{ needs.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
