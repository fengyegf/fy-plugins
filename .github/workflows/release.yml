name: release

# 一个仓库多个插件：按插件单独打 tag，一次只发布一个插件。
#
#   git tag whois-v0.1.2
#   git push origin whois-v0.1.2
#
# 推 tag 会构建该插件在 plugin.json 里声明的全部平台，打 bundle 并挂到 Release。
# 手动触发（Actions → release → Run workflow）只产出各平台 artifact，不建 Release，
# 用于先验证编译。

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      plugin:
        description: "插件 id（crates/fuyubot-plugin-<id>）"
        required: true
        type: choice
        options: [whois, musiccard, epic, kfc, ppxfy, system, trending, bidibot, rusto, agent]
      version:
        description: "semver，不带 v（例如 0.1.2）"
        required: true

permissions:
  contents: write
  # 构建来源证明（attest-build-provenance）需要这两个权限。
  id-token: write
  attestations: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.plan.outputs.id }}
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            id="${{ inputs.plugin }}"
            version="${{ inputs.version }}"
          else
            # tag 形如 fengyegf.whois-v0.1.6（多插件仓库用 <id>-v<版本>）
            ref="${GITHUB_REF_NAME}"
            plugin_id="${ref%%-v*}"
            id="${plugin_id##*.}"
            version="${ref#*-v}"
          fi
          python3 scripts/plan.py --plugin "$id" --version "$version" --github-output

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@v2
      - name: Setup Android NDK
        if: matrix.android_abi != ''
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Install cargo-ndk
        if: matrix.android_abi != ''
        run: cargo install cargo-ndk --locked
      # Linux 的 .so 会被宿主 dlopen，而 GLIBC_x.y 符号版本是**构建机**决定的：
      # ubuntu-latest 原生构建会链到 glibc 2.39+，老机器加载直接失败：
      #   /lib/x86_64-linux-gnu/libm.so.6: version `GLIBC_2.43' not found
      # 所以固定用 cargo-zigbuild 链到 glibc 2.28（Debian 10 / Ubuntu 20.04 / RHEL 8 起都能加载），
      # 打包时 scripts/package.py 还会再静态检查一遍，超基线直接失败。
      - name: Install zig + cargo-zigbuild
        if: matrix.platform == 'linux-x86_64'
        run: |
          python3 -m pip install --user --break-system-packages ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build (Linux x86_64, glibc 2.28)
        if: matrix.platform == 'linux-x86_64'
        run: >-
          cargo zigbuild --release --locked
          -p "fuyubot-plugin-${{ needs.meta.outputs.id }}"
          --target x86_64-unknown-linux-gnu.2.28
      - name: Build (native)
        if: matrix.target == '' && matrix.platform != 'linux-x86_64'
        run: cargo build --release --locked -p "fuyubot-plugin-${{ needs.meta.outputs.id }}"
      - name: Build (Android)
        if: matrix.android_abi != ''
        run: >-
          cargo ndk -t "${{ matrix.android_abi }}" --platform 24
          build --release --locked -p "fuyubot-plugin-${{ needs.meta.outputs.id }}"
      - name: Package bundle
        shell: bash
        env:
          # linux 用 zigbuild 的 triple 目录；其它平台留空，package.py 按平台自己推断。
          TARGET_TRIPLE: ${{ matrix.platform == 'linux-x86_64' && 'x86_64-unknown-linux-gnu' || '' }}
        # macOS / Linux 镜像只有 python3，Windows 镜像的可执行名是 python。
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          scripts/package.py
          --plugin "${{ needs.meta.outputs.id }}"
          --platform "${{ matrix.platform }}"
          --version "${{ needs.meta.outputs.version }}"
          --target-triple "$TARGET_TRIPLE"
      # 为 bundle 生成构建来源证明：发布后可用
      #   gh attestation verify <zip> --repo <owner>/<repo>
      # 校验它是本仓库 CI 构建的；与仓库的 Release 不可变性配合使用。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [meta, build]
    # 手动触发只产出 Actions artifact，推 tag 才建 Release。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      # 先建 draft、传完全部资产再发布：仓库启用 Release 不可变性后，
      # 发布后补资产 / 改标签 / 改说明都会被拒绝。
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ needs.meta.outputs.id }} v${{ needs.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
      # release job 没有 checkout，gh 必须显式 --repo 才知道是哪个仓库。
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release edit "${{ github.ref_name }}" --draft=false
          --repo "${{ github.repository }}"
