<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#000;font-family:'Segoe UI','Segoe UI Emoji','Segoe UI Symbol','Microsoft YaHei','Microsoft YaHei UI','Noto Sans CJK SC',sans-serif}
body{padding:0}
/* layer: default */
.absolute{position:absolute;}
.relative{position:relative;}
.m-0{margin:0;}
.mx-2{margin-left:0.5rem;margin-right:0.5rem;}
.ml-2{margin-left:0.5rem;}
.mt-1{margin-top:0.25rem;}
.mt-10{margin-top:2.5rem;}
.mt-2{margin-top:0.5rem;}
.mt-3{margin-top:0.75rem;}
.h-120{height:30rem;}
.h-200{height:50rem;}
.h-25{height:6.25rem;}
.h-3{height:0.75rem;}
.h-45{height:11.25rem;}
.h-full{height:100%;}
.w-25{width:6.25rem;}
.w-340{width:85rem;}
.w-350{width:87.5rem;}
.w-45{width:11.25rem;}
.w-full{width:100%;}
.flex{display:flex;}
.flex-1{flex:1 1 0%;}
.shrink-0{flex-shrink:0;}
.flex-grow{flex-grow:1;}
.flex-row{flex-direction:row;}
.flex-col{flex-direction:column;}
.flex-wrap{flex-wrap:wrap;}
.items-start{align-items:flex-start;}
.items-center{align-items:center;}
.justify-start{justify-content:flex-start;}
.justify-center{justify-content:center;}
.overflow-hidden{overflow:hidden;}
.border-l{border-left-width:1px;}
.border-white\/30{border-color:rgb(255 255 255 / 0.3);}
.rounded{border-radius:0.25rem;}
.rounded-full{border-radius:9999px;}
.rounded-xl{border-radius:0.75rem;}
.bg-blue-500{--un-bg-opacity:1;background-color:rgb(59 130 246 / var(--un-bg-opacity));}
.bg-gray-300{--un-bg-opacity:1;background-color:rgb(209 213 219 / var(--un-bg-opacity));}
.bg-white\/70{background-color:rgb(255 255 255 / 0.7);}
.bg-white\/80{background-color:rgb(255 255 255 / 0.8);}
.p-0{padding:0;}
.p-2{padding:0.5rem;}
.p-4{padding:1rem;}
.p-5{padding:1.25rem;}
.px-2{padding-left:0.5rem;padding-right:0.5rem;}
.py-1{padding-top:0.25rem;padding-bottom:0.25rem;}
.text-2xl{font-size:1.5rem;line-height:2rem;}
.text-4xl{font-size:2.25rem;line-height:2.5rem;}
.text-lg{font-size:1.125rem;line-height:1.75rem;}
.text-sm{font-size:0.875rem;line-height:1.25rem;}
.text-xs{font-size:0.75rem;line-height:1rem;}
.text-blue-500{--un-text-opacity:1;color:rgb(59 130 246 / var(--un-text-opacity));}
.text-gray-500{--un-text-opacity:1;color:rgb(107 114 128 / var(--un-text-opacity));}
.text-gray-600{--un-text-opacity:1;color:rgb(75 85 99 / var(--un-text-opacity));}
.font-bold{font-weight:700;}
.font-semibold{font-weight:600;}
/* 单行文本兜底：名字 / 用户名 / 插件名过长时省略，不把面板撑破。 */
.text-ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
</style>
<div class="flex relative w-350 h-200 overflow-hidden"
    style="background: linear-gradient(132.5deg, rgba(255, 255, 255, 1) 0%, rgba(206, 237, 219, 1) 100%);">
    <img v-if="background" :src="background" alt="背景"
        class="flex absolute w-full h-full" style="object-fit:cover;" />
    <div class="absolute flex h-full w-full"
        style="background: linear-gradient(90deg, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.09) 70%);">
    </div>
    <div class="flex absolute items-center justify-center w-full h-full">
        <div class="flex flex-col justify-center items-start">
            <!-- 用户信息 -->
            <div class="flex flex-row items-center">
                <div class="flex w-45 h-45 shrink-0">
                    <img v-if="bot.photo" :src="bot.photo" alt="头像"
                        class="flex rounded-full w-full h-full"
                        style="border: 5px solid rgba(255, 255, 255, 1); object-fit:cover;" />
                    <div v-else class="flex rounded-full w-full h-full"
                        style="border: 5px solid rgba(255, 255, 255, 1); background: linear-gradient(135deg, #7dd3fc, #2563eb);">
                    </div>
                </div>
                <div class="flex flex-col justify-center p-5">
                    <p class="font-bold text-4xl m-0 p-0 text-ellipsis" style="max-width: 1080px;">{{ bot.name }}</p>
                    <p class="text-gray-500 text-2xl m-0 p-0 text-ellipsis" style="max-width: 1080px;">@{{ bot.username }}</p>
                    <p class="text-gray-500 text-2xl m-0 p-0">ID:{{ bot.id }}</p>
                </div>
            </div>

            <div class="flex flex-row w-340 h-120 rounded-xl mt-10">
                <!-- 左侧卡片区域 -->
                <div class="flex flex-col flex-1 p-4">
                    <!-- Admin 信息 -->
                    <div class="flex flex-col mt-2">
                        <p class="text-lg font-semibold m-0 p-0">admin</p>
                        <div class="flex flex-col bg-white/70 rounded-xl p-2 mt-1"
                            style="border: 1px solid rgba(0, 0, 0, 0.1);">
                            <div class="flex flex-row items-center">
                                <div class="flex w-25 h-25 shrink-0">
                                    <img v-if="admin.photo" :src="admin.photo" alt="管理员头像"
                                        class="flex rounded-full w-full h-full"
                                        style="border: 5px solid rgba(255, 255, 255, 1); object-fit:cover;" />
                                    <div v-else class="flex rounded-full w-full h-full"
                                        style="border: 5px solid rgba(255, 255, 255, 1); background: linear-gradient(135deg, #fbcfe8, #db2777);">
                                    </div>
                                </div>
                                <div class="flex flex-col p-5">
                                    <template v-if="admin.configured">
                                        <p class="text-2xl font-semibold m-0 p-0 text-ellipsis" style="max-width: 460px;">{{ admin.name }}</p>
                                        <p class="text-lg text-gray-600 m-0 p-0 text-ellipsis" style="max-width: 460px;">@{{ admin.username }}</p>
                                        <p class="text-lg text-gray-600 m-0 p-0">ID:{{ admin.id }}</p>
                                    </template>
                                    <template v-else>
                                        <p class="text-2xl font-semibold m-0 p-0">未配置管理员</p>
                                        <p class="text-lg text-gray-600 m-0 p-0">请前往 [plugin.system] 添加 super_admin</p>
                                    </template>
                                </div>
                            </div>
                            <template v-if="admin.configured">
                                <p class="text-xs text-gray-600 mt-1 m-0 p-0 text-ellipsis">留言：如果遇到bug前往 @{{ admin.username }} 反馈</p>
                            </template>
                            <template v-else>
                                <p class="text-xs text-gray-600 mt-1 m-0 p-0 text-ellipsis">未配置管理员（[plugin.system] super_admin）</p>
                            </template>
                        </div>
                    </div>

                    <!-- TDLib 信息 -->
                    <div class="flex flex-col mt-2">
                        <p class="text-lg font-semibold m-0 p-0">TDLib</p>
                        <div class="flex flex-col bg-white/70 rounded-xl p-2 mt-1"
                            style="border: 1px solid rgba(0, 0, 0, 0.1);">
                            <p class="text-lg m-0 p-0 text-ellipsis">version:{{ tblib.version }}</p>
                            <p class="text-lg text-gray-600 m-0 p-0 text-ellipsis">commit hash:{{ tblib.commitHash }}</p>
                        </div>
                    </div>

                    <!-- CPU / RAM 使用率 -->
                    <div class="flex flex-col mt-2">
                        <p class="text-lg font-semibold m-0 p-0">使用情况</p>
                        <div class="flex flex-col bg-white/70 rounded-xl p-2 mt-1"
                            style="border: 1px solid rgba(0, 0, 0, 0.1);">
                            <div v-for="(value, key) in system.system" :key="key" class="flex flex-row items-center">
                                <p class="text-lg shrink-0 m-0 p-0 text-ellipsis" style="max-width: 120px;">{{ key }}</p>
                                <template v-if="!value.placeholder">
                                    <div class="flex flex-grow relative h-3 bg-gray-300 rounded-full overflow-hidden mx-2">
                                        <div class="flex absolute h-full bg-blue-500 rounded-full"
                                            :style="'width: ' + value.usage + '%'"></div>
                                    </div>
                                    <p class="text-lg shrink-0 m-0 p-0">{{ value.usage }}%</p>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右侧卡片区域 -->
                <div class="flex flex-col flex-1 p-4 border-l border-white/30">
                    <!-- 磁盘空间 -->
                    <div class="flex flex-col">
                        <p class="text-lg font-semibold">磁盘空间</p>
                        <div class="flex flex-col bg-white/70 rounded-xl p-2 mt-1"
                            style="border: 1px solid rgba(0, 0, 0, 0.1);">
                            <div v-for="(value, key) in system.source" :key="key" class="flex flex-row items-center">
                                <p class="text-lg shrink-0 m-0 p-0 text-ellipsis" style="max-width: 130px;">{{ key }}</p>
                                <template v-if="!value.placeholder">
                                    <div class="flex flex-grow relative h-3 bg-gray-300 rounded-full overflow-hidden mx-2">
                                        <div class="flex absolute h-full bg-blue-500 rounded-full m-0 p-0"
                                            :style="'width: ' + value.usagePercent + '%'"></div>
                                    </div>
                                    <p class="text-lg shrink-0 m-0 p-0"> {{ value.used }}/{{ value.total }}</p>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- 已加载插件 -->
                    <div class="flex flex-col mt-3 flex-grow" style="min-height: 0;">
                        <p class="text-lg font-semibold">已加载插件</p>
                        <div class="flex flex-col bg-white/70 rounded-xl p-2 mt-1 w-full justify-start flex-grow"
                            style="border: 1px solid rgba(0, 0, 0, 0.1); gap: 0.5rem; min-height: 0; overflow: hidden;">
                            <div v-if="plugin_count" class="flex flex-col w-full flex-grow"
                                style="min-height: 0; overflow: hidden;">
                                <div class="flex flex-row flex-wrap w-full items-start" style="gap: 5px;">
                                    <div v-for="(manager, key) in plugins" :key="key"
                                        class="flex items-center bg-white/80 rounded px-2 shrink-0"
                                        style="border: 1px solid rgba(0, 0, 0, 0.1); padding-top: 2px; padding-bottom: 2px; max-width: 100%;">
                                        <p class="m-0 p-0 text-sm text-ellipsis" style="max-width: 190px;">{{ manager.name }}</p>
                                        <p class="m-0 p-0 text-blue-500 text-sm ml-2 shrink-0">{{ manager.version }}</p>
                                    </div>
                                    <div v-if="plugin_overflow" class="flex items-center bg-white/80 rounded px-2 shrink-0"
                                        style="border: 1px solid rgba(0, 0, 0, 0.1); padding-top: 2px; padding-bottom: 2px;">
                                        <p class="m-0 p-0 text-sm">+{{ plugin_overflow }}</p>
                                    </div>
                                </div>
                            </div>
                            <p v-else class="text-lg text-gray-600 m-0 p-0 flex-grow">暂无数据</p>
                            <div class="flex flex-row w-full items-center shrink-0" style="justify-content: space-between;">
                                <p class="text-xs text-gray-600 m-0 p-0">共 {{ plugin_count }} 个插件</p>
                                <p class="text-xs text-gray-600 m-0 p-0">Generated by FuyuBot</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
