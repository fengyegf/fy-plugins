# system：系统信息卡片插件。
#
# 本 crate 同时产出两种库目标：
# - `cdylib`：宿主 dlopen 的插件动态库（`system.dll` / `libsystem.so`）；
# - `rlib`：可被其他 Rust 代码依赖 / 被 `cargo test`、`examples/` 使用的库。
[package]
name = "fuyubot-plugin-system"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "查看宿主机系统信息与机器人状态，渲染成信息卡片并以照片回复"
license = "LGPL-3.0-or-later"

[lib]
# 动态库文件名跟着 lib name 走：保持 `system.dll`，plugin.json 的 entry 不用改。
name = "system"
crate-type = ["cdylib", "rlib"]

[dependencies]
fuyubot-plugin-api.workspace = true
hyper-render.workspace = true
# 背景 / 头像的位图合成：解码、缩放、圆角、JPEG 编码。
image = { workspace = true, features = ["jpeg", "png"] }
# 系统信息：CPU / 内存 / SWAP / 磁盘。只要 system + disk，不拖 network / component。
sysinfo = { version = "0.31", default-features = false, features = ["system", "disk", "multithread"] }
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true

[lints.clippy]
# `Template::text` 的 left/top/width/height 本来就是平铺的版面参数，拆结构体只会更绕。
too_many_arguments = "allow"
# layout 的单元测试断言的是常量版面关系（不重叠、不溢出），常量断言是刻意的。
assertions_on_constants = "allow"
