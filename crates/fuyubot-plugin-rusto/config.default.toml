# rusto 默认配置（随发布包分发，最低优先级；宿主 / 用户配置会覆盖这里）
auto = false
max_side = 960
concurrency = 1
rec_workers = 1
model = "ppocrv6-tiny-int8"
# 模型根目录；空 = 依次找 plugins/fengyegf.rusto/models、动态库所在插件目录的
# models/、data/plugins/rusto/models、models、rusto 缓存。缺模型时插件内置纯 Rust
# HTTPS 下载（官方源失败自动换 hf-mirror；也可用下面的 mirror 指定）。
# model_dir = ""
# mirror = "https://hf-mirror.com"
detail_default = false
reply_placeholder = true
chunk_size = 3800
timeout_ms = 20000
