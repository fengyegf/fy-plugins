# rusto 的离线回放配置：不接 TDLib，只验证「插件加载 + 图片消息解析 + 命令分发」。
# 超时压到 300ms，避免没有 TDLib 时每条查询都干等。
# model_dir 故意指向一个不存在的目录：回放里引擎会回 model_missing，
# 正好验证「模型缺失」这条降级路径是给人看的而不是 panic。
[bot]
name = "replay"

[plugins]
dir = "plugins"

[telegram]
account_type = "bot"
api_id = 1
data_dir = "data"

[plugin.fengyegf.rusto]
auto = false
max_side = 1600
concurrency = 1
model = "ppocrv6-tiny"
model_dir = "testdata/absent-models"
reply_placeholder = false
timeout_ms = 300
