[package]
name = "fuyubot-plugin-agent"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "AI Agent 运行时：TDLib 会话 / 话题 + LLM 网关 + 会话落盘 + 对外工具与服务"
license = "MIT"

[lib]
name = "agent"
crate-type = ["cdylib", "rlib"]

[dependencies]
fuyubot-plugin-api.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
