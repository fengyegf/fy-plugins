# fengyegf.agent 的默认配置（最低优先级）。
# 用户在自己的 fuyubot.toml 的 [plugin.fengyegf.agent] 段里覆盖这些键。
#
# 设计：Agent 的行为尽量确定，只保留「部署时真的会不同」的开关。
#   · 会话历史默认全部带上，没有「每次带几条」这种旋钮；
#   · 上下文太长用 /agent compress：让模型把历史压成摘要，之后继续聊；
#   · 同一会话 600ms 内的连发消息自动合并成一次请求，只回答最后一条；
#   · 超过 4000 字的工具结果自动分页：模型可按页翻阅，或按 JSON 字段只取需要的部分；
#   · 流式、超时、工具轮数、截断长度等都是内置常量，调不了也不用调。
#
# 硬依赖：fengyegf.llm（网关）。没装 llm 插件时本插件停在 Pending。

# 总开关。关掉 = 不订阅、不注册工具/服务（插件仍在，可被 plugin list 看到）。
enabled = true

# 走网关的哪个方法：chat（OpenAI Chat Completions）/ messages（Anthropic）/ responses。
gateway_method = "chat"
# 空 = 用网关配置里的 default_model。
model = ""
# 系统提示词。留空则不注入 system 消息。
system_prompt = "你是运行在 Telegram 里的 AI Agent。回答简洁、可执行；需要排版时用 Markdown。"

# 回复形态：plain（纯文本）/ markdown（本地 parseTextEntities）/ rich（富消息，失败自动降级 markdown）。
# 默认 rich：终稿走 inputMessageRichMessage（Bot API 富文本），失败逐级降级。
reply_mode = "rich"
# 私聊用官方同款「草稿消息」做流式：空草稿 = 客户端自带的 Thinking… 占位，
# 之后同一 draft_id 反复 sendTextMessageDraft 呈现流式，最后 sendMessage 落一条正式消息。
# 群聊不支持草稿，直接发终稿。
stream_replies = true

# 会话准入。
allow_private = true
allow_groups = true
# 群里必须 @ 我或回复我的消息才接（Bot-to-Bot 的群内约定）。
group_require_mention = true
# Bot-to-Bot：默认关；开启后仍受白名单 / 深度 / 频率限制。
allow_bots = false
# 允许对话的对端 bot 用户名（不带 @）；allow_bots = true 时生效，空 = 只按 allow_bots 放行。
bot_allowlist = []

# 额外不下发给模型的工具名：精确名，或以 * 结尾的前缀（如 "my.plugin.*"）。
# 只能追加：fuyubot.td.functions 是内置屏蔽（原始 TDLib 调用，schema 巨大），删掉也不会解除；
# 注意 fengyegf.agent.* 系列会让模型反过来调本插件（可能套娃）。
tool_denylist = []

# 私聊话题：首条消息自动开一个话题（TDLib createForumTopic，需要 bot 开了 topics）。
topic_auto_create = true

# 会话落盘目录；空 = data/plugins/fengyegf.agent/sessions（相对宿主工作目录）。
session_dir = ""
# 会话自动清理：超过这个天数没有活动的会话会被删除（插件启动时 + 每小时检查一次）。
# 0 = 永久保留，不再自动删除（也不再按数量修剪）。
session_ttl_days = 7
