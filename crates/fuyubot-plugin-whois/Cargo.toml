# whois：域名 Whois 信息查询卡片插件。
#
# 本 crate 同时产出两种库目标：
# - `cdylib`：宿主 dlopen 的插件动态库（`whois.dll` / `libwhois.so` / `libwhois.dylib`）；
# - `rlib`：可被其他 Rust 代码依赖 / 被 `cargo test`、`examples/` 使用的库。
# 两者共用同一份源码，宿主只认 `plugin_*` 导出符号，不受 rlib 影响。
[package]
name = "fuyubot-plugin-whois"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "查询域名 Whois 信息，渲染成信息卡片并以照片回复"

[lib]
# 动态库文件名跟着 lib name 走：保持 `whois.dll`，plugin.json 的 entry 不用改。
name = "whois"
crate-type = ["cdylib", "rlib"]

[dependencies]
fuyubot-plugin-api.workspace = true
hyper-render.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true
# 网站图标解码：ICO / PNG / GIF / WebP。版本与 hyper-render 依赖链里的 image 一致。
image = { workspace = true, features = ["ico", "png", "gif", "webp"] }
# 把图标位图编码成 inline SVG `<image>` 的 data URI。
base64 = "0.22"
