<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#292044;color:#302d36;font-family:'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei','Microsoft YaHei UI','PingFang SC',sans-serif}
body{padding:0}
.absolute{position:absolute;}
.relative{position:relative;}
.flex{display:flex;}
.flex-col{flex-direction:column;}
.items-center{align-items:center;}
.justify-center{justify-content:center;}
.overflow-hidden{overflow:hidden;}
/* 虚线：Blitz 的 border-style:dashed 不可靠，用一排 2px 小方块拼（与原 TS 版视觉一致）。 */
.dash{position:absolute;top:0;width:7px;height:2px;}
</style>
<div class="flex relative overflow-hidden" style="display:flex;width:650px;height:1220px;background:#292044;color:#302d36;font-family:'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei','Microsoft YaHei UI','PingFang SC',sans-serif;">
  <img v-if="cover" :src="cover" class="absolute" style="width:650px;height:1220px;object-fit:cover;opacity:.34;" />
  <div class="absolute" style="display:flex;width:650px;height:1220px;background:linear-gradient(180deg,rgba(80,38,41,.56),rgba(38,31,84,.82));"></div>

  <div class="flex absolute flex-col overflow-hidden" style="display:flex;left:26px;top:26px;width:598px;height:1168px;border-radius:26px;background:rgba(249,247,246,.90);">
    <img :src="cover" style="width:546px;height:546px;margin:26px 26px 0;border-radius:20px;object-fit:cover;background:rgba(57,48,70,.08);" />

    <div class="flex items-center" style="display:flex;height:112px;margin:0 26px;">
      <div class="flex flex-col" style="display:flex;width:454px;">
        <div class="flex" :style="{ display: 'flex', fontSize: titleSize + 'px', lineHeight: '40px', whiteSpace: 'nowrap', overflow: 'hidden' }">{{ title }}</div>
        <div class="flex" :style="{ display: 'flex', fontSize: artistsSize + 'px', lineHeight: '28px', color: '#756f79', whiteSpace: 'nowrap', overflow: 'hidden' }">{{ artists }} · {{ album }}</div>
      </div>
      <img :src="qrCode" style="width:76px;height:76px;margin-left:14px;" />
    </div>

    <div class="flex" style="display:flex;height:395px;padding:28px 38px 0;">
      <div class="flex flex-col" style="display:flex;width:126px;padding-top:2px;">
        <div class="flex" style="display:flex;font-size:24px;color:#716b78;line-height:30px;">{{ month }}</div>
        <div class="flex" style="display:flex;font-size:58px;line-height:66px;font-weight:300;">{{ day }}</div>
      </div>
      <div class="flex flex-col" style="display:flex;width:392px;">
        <div v-for="(line, index) in lyrics" :key="index" class="flex flex-col" style="display:flex;margin-bottom:13px;">
          <div class="flex" style="display:flex;font-size:21px;line-height:29px;">{{ line.text }}</div>
          <div v-if="line.translation" class="flex" style="display:flex;font-size:15px;line-height:22px;color:#77717b;">{{ line.translation }}</div>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-center" style="display:flex;height:87px;margin:0 26px;font-size:20px;color:#645e68;">网易云音乐｜每日音乐卡片</div>

    <!-- 头部与歌词区之间的虚线（46 段 7px 实线 + 5px 空隙 = 546px）。 -->
    <div style="position:absolute;left:26px;top:684px;width:546px;height:2px;overflow:hidden;">
      <div v-for="n in 46" :key="n" class="dash" :style="{ left: (n - 1) * 12 + 'px', background: 'rgba(57,48,70,.16)' }"></div>
    </div>
    <!-- 歌词区与页脚之间的虚线。 -->
    <div style="position:absolute;left:26px;top:1079px;width:546px;height:2px;overflow:hidden;">
      <div v-for="n in 46" :key="n" class="dash" :style="{ left: (n - 1) * 12 + 'px', background: 'rgba(57,48,70,.18)' }"></div>
    </div>
  </div>

  <div class="flex absolute" style="display:flex;right:31px;bottom:7px;font-size:12px;color:rgba(255,255,255,.82);">Generated by Fuyu_TDBot</div>
</div>
